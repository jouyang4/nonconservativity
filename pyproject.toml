[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nonconservativity"
version = "0.2.0"
description = "Reciprocity / path-integrability analysis of structure-prediction Cartesian fields"
requires-python = ">=3.10"
authors = [{ name = "Jonathan R. Ouyang", email = "jouyan11@jhmi.edu" }]
license = { text = "MIT" }
dependencies = ["numpy>=1.26,<2", "scipy>=1.11", "pandas>=2.0", "matplotlib>=3.7", "biopython>=1.81", "pyyaml>=6.0"]

[project.urls]
Paper = "https://openreview.net/forum?id=3bb2CB8WHx"
Companion = "https://openreview.net/forum?id=EMnLEnwXbA"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
